name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Docker Image Name'
        required: true
        type: string
      tag:
        description: 'Docker Tag Name'
        required: true
        type: string
      pushdkhub:
        description: '是否推送 Docker Hub'
        required: false
        type: choice
        default: 'n'
        options:
          - y
          - n

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      # 供 if 条件与 tag 计算使用。Docker Hub token 不在此展开，只在登录步骤直接用。
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      OWNER: ${{ github.repository_owner }}
      IMAGE: ${{ inputs.image }}
      TAG: ${{ inputs.tag }}
      # 未显式传值时回退为 n（通过 API/gh CLI 触发可能不带该输入）
      PUSH_DH: ${{ inputs.pushdkhub || 'n' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 1) 解析 JS_NODE_CONFIG（多行 KEY=VALUE），按 TYPE 选择源文件，临时生成 index.js
      #    键映射：CHAT_TOKEN 与 BOT_TOKEN 等价；NEZHA_SERVER / NEZHA_KEY 可选
      - name: Prepare index.js from selected source
        env:
          JS_NODE_CONFIG: ${{ secrets.JS_NODE_CONFIG }}
        run: |
          set -euo pipefail

          # --- 解析配置，写入临时文件（供后续安全检查步骤复用）---
          cfgfile=/tmp/js_node_config.env
          : > "$cfgfile"
          while IFS= read -r line || [ -n "$line" ]; do
            line="${line%$'\r'}"                 # 兼容 CRLF 行尾
            [ -z "$line" ] && continue
            case "$line" in '#'*) continue ;; esac
            case "$line" in
              *=*) ;;
              *) echo "::error::config line missing '=' (key: ${line:0:12})"; exit 1 ;;
            esac
            key="${line%%=*}"
            val="${line#*=}"                     # 只按第一个 '=' 切分，值中可含 ':' '=' 等
            case "$key" in
              *[!A-Za-z0-9_]*|'') echo "::error::invalid config key"; exit 1 ;;
            esac
            case "$key" in
              CHAT_TOKEN) key=BOT_TOKEN ;;       # 归一化：CHAT_TOKEN -> BOT_TOKEN
            esac
            case "$key" in
              TYPE|UUID|ARGO_AUTH|ARGO_DOMAIN|CHAT_ID|BOT_TOKEN|NEZHA_SERVER|NEZHA_KEY) ;;
              *) echo "::warning::unrecognized config key: $key (ignored)"; continue ;;
            esac
            printf '%s=%s\n' "$key" "$val" >> "$cfgfile"
          done <<< "$JS_NODE_CONFIG"

          if [ ! -s "$cfgfile" ]; then
            echo "::error::JS_NODE_CONFIG is empty or unparsable"
            exit 1
          fi

          cfg_get() {  # 用法: cfg_get KEY [DEFAULT]
            local out="${2:-}"
            while IFS= read -r kv; do
              if [ "${kv%%=*}" = "$1" ]; then out="${kv#*=}"; break; fi
            done < "$cfgfile"
            printf '%s' "$out"
          }

          NODE_TYPE=$(cfg_get TYPE)
          V_UUID=$(cfg_get UUID)
          V_ARGO_AUTH=$(cfg_get ARGO_AUTH)
          V_ARGO_DOMAIN=$(cfg_get ARGO_DOMAIN)
          V_CHAT_ID=$(cfg_get CHAT_ID)
          V_BOT_TOKEN=$(cfg_get BOT_TOKEN)
          V_NEZHA_SERVER=$(cfg_get NEZHA_SERVER)
          V_NEZHA_KEY=$(cfg_get NEZHA_KEY)

          # --- 校验 TYPE ---
          case "$NODE_TYPE" in
            xy|sb|ws) ;;
            *)
              echo "::error::TYPE 必须是 xy / sb / ws 之一，当前为 '$NODE_TYPE'"
              exit 1
              ;;
          esac

          # --- 校验必填（只报变量名，绝不打印值）。NEZHA_* 可选，缺失时跳过注入 ---
          missing=""
          for kv in \
            "UUID:$V_UUID" \
            "ARGO_AUTH:$V_ARGO_AUTH" \
            "ARGO_DOMAIN:$V_ARGO_DOMAIN" \
            "CHAT_ID:$V_CHAT_ID" \
            "BOT_TOKEN:$V_BOT_TOKEN"
          do
            name="${kv%%:*}"; val="${kv#*:}"
            if [ -z "$val" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required key(s) in JS_NODE_CONFIG:$missing"
            exit 1
          fi
          echo "::notice::type=$NODE_TYPE, required keys present"

          SRC="js-node/index_${NODE_TYPE}.js"
          if [ ! -f "$SRC" ]; then
            echo "::error::Source file not found: $SRC"
            exit 1
          fi

          # --- 生成注入块（JS 单引号字符串，转义反斜杠与单引号；空值跳过）---
          esc() { printf '%s' "$1" | sed -e 's/\\/\\\\/g' -e "s/'/\\\\'/g"; }
          inject() {
            [ -z "$2" ] && return 0
            echo "process.env.$1 = process.env.$1 || '$(esc "$2")'"
          }
          {
            echo ""
            echo "// runtime secrets injected at build time"
            inject NEZHA_SERVER "$V_NEZHA_SERVER"
            inject NEZHA_KEY "$V_NEZHA_KEY"
            inject UUID "$V_UUID"
            inject ARGO_AUTH "$V_ARGO_AUTH"
            inject ARGO_DOMAIN "$V_ARGO_DOMAIN"
            inject CHAT_ID "$V_CHAT_ID"
            inject BOT_TOKEN "$V_BOT_TOKEN"
          } > /tmp/inject-head.js

          # --- 组装：shebang 保留首行 + 注入块 + 源文件主体 ---
          {
            head -1 "$SRC"
            cat /tmp/inject-head.js
            tail -n +2 "$SRC"
          } > js-node/index.js

          node --check js-node/index.js
          echo "::notice::index.js assembled from $SRC"

      # 2) 安装混淆器（装到 js-node/，与后续混淆步骤的工作目录保持一致）
      - name: Install obfuscator
        working-directory: js-node
        run: npm install --no-save --silent javascript-obfuscator@4

      # 3) 混淆。关键：threshold=1 强制全量字符串编码，否则注入值会明文残留。
      - name: Obfuscate index.js
        working-directory: js-node
        run: |
          set -euo pipefail
          cp index.js /tmp/index.plain.js

          # 混淆前记录大小，用于验证产物确实被改写
          size_before=$(wc -c < index.js)

          # 使用本地已安装的 CLI，避免 npx 在缺包时静默返回 0
          OBF=./node_modules/.bin/javascript-obfuscator
          if [ ! -x "$OBF" ]; then
            echo "::error::obfuscator binary not found at $OBF (pwd=$(pwd))"
            exit 1
          fi

          "$OBF" index.js \
            --output index.js \
            --string-array true \
            --string-array-encoding base64 \
            --string-array-threshold 1 \
            --compact true \
            --identifier-names-generator hexadecimal \
            --self-defending false

          node --check index.js

          # 显式确认产物已变更：若混淆失败，文件会保持原样
          size_after=$(wc -c < index.js)
          if [ "$size_before" -eq "$size_after" ]; then
            echo "::error::obfuscation produced identical output ($size_before bytes). Aborting."
            exit 1
          fi
          if ! grep -q "0x" index.js; then
            echo "::error::obfuscation markers not found in output. Aborting."
            exit 1
          fi

          echo "::notice::obfuscated ($size_before -> $size_after bytes)"

      # 4) 构建前安全检查：确认注入值没有明文残留
      #    TYPE 仅用于选源文件、不注入代码，且值太短易误报（如 "xy" 命中 "proxy"），跳过检查
      - name: Safety check (no plaintext leak)
        run: |
          set -euo pipefail
          cfgfile=/tmp/js_node_config.env
          if [ ! -s "$cfgfile" ]; then
            echo "::error::parsed config not found at $cfgfile (previous step did not run?)"
            exit 1
          fi
          leaked=0
          total=0
          while IFS= read -r kv; do
            key="${kv%%=*}"
            val="${kv#*=}"
            [ -z "$val" ] && continue
            case "$key" in TYPE) continue ;; esac
            total=$((total + 1))
            if grep -qF -- "$val" js-node/index.js; then leaked=$((leaked + 1)); fi
          done < "$cfgfile"
          if [ "$leaked" -gt 0 ]; then
            echo "::error::plaintext secret detected in obfuscated bundle ($leaked of $total). Aborting."
            exit 1
          fi
          echo "::notice::safety check passed ($total values checked), no plaintext leaked"

      # 4.5) 校验 pushdkhub 并计算 tag 列表
      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail

          # --- 校验 pushdkhub：只接受 y / n ---
          case "$PUSH_DH" in
            y|n) ;;
            *) echo "::error::pushdkhub 只能是 y 或 n，当前为 '$PUSH_DH'"; exit 1 ;;
          esac

          # tag 会被拼进 build-push-action 的 tags，先做字符白名单校验
          for v in "$IMAGE" "$TAG"; do
            case "$v" in
              *[!A-Za-z0-9._-]*|'') echo "::error::illegal image/tag value (allowed: A-Z a-z 0-9 . _ -)"; exit 1 ;;
            esac
          done

          ghcr="ghcr.io/$OWNER/$IMAGE:$TAG"
          if [ "$PUSH_DH" = "n" ]; then
            printf 'tags=%s\n' "$ghcr" >> "$GITHUB_OUTPUT"
            echo "::notice::pushdkhub=n, pushing to ghcr.io only"
          elif [ -z "$DH_USER" ]; then
            echo "::error::pushdkhub=y 但未配置 secret DOCKERHUB_USERNAME"
            exit 1
          else
            printf 'tags=%s,docker.io/%s/%s:%s\n' "$ghcr" "$DH_USER" "$IMAGE" "$TAG" >> "$GITHUB_OUTPUT"
            echo "::notice::pushdkhub=y, targets: ghcr.io + docker.io/$DH_USER"
          fi

      # 4.6) 仅在确定要推 Docker Hub 时登录（此时 DOCKERHUB_USERNAME 已确认非空）
      - name: Log in to Docker Hub
        if: env.PUSH_DH == 'y'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5) 构建并推送（Dockerfile 保持不变）
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: js-node
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=HTTP Server
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
